[build-system]
requires = ["pbr>=7.1.0"]
build-backend = "pbr.build"

[project]
name = "git-pw"
description = "Git-Patchwork integration tool"
authors = [
    {name = "Stephen Finucane", email = "stephen@that.guru"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
dynamic = ["version"]
dependencies = [
    "arrow>=0.10",
    "click>=8.0",
    "PyYAML>=5.1",
    "requests>=2.0",
    "tabulate>=0.8",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
]

[dependency-groups]
test = [
    "pytest>=3.0",
    "pytest-cov",
]
typing = [
    "mypy",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
    "types-tabulate",
]

[project.urls]
"Bug Tracker" = "https://github.com/getpatchwork/git-pw/issues"
"Source Code" = "https://github.com/getpatchwork/git-pw"
"Documentation" = "https://git-pw.readthedocs.io"

[project.scripts]
git-pw = "git_pw.shell:cli"

[tool.setuptools.packages.find]
include = ["git_pw*"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "U"]
ignore = [
    # we only use asserts for type narrowing
    "S101",
    # FIXME: Add timeouts to requests
    "S113",
    # client tool can use subprocess as they like
    "S603",
    # FIXME: Use f-strings instead of printf
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
show_column_numbers = true
show_error_context = true
show_error_code_links = true
pretty = true
strict = true
files = ["git_pw"]
