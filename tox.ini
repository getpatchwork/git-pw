[tox]
minversion = 4.28.0
envlist = pep8,mypy,clean,py3,report

[testenv]
dependency_groups =
  test
commands =
  pytest -Wall --cov=git_pw --cov-report term-missing {posargs}

[testenv:pep8]
skip_install = true
deps =
  pre-commit
commands =
  pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
dependency_groups =
  test
  typing
commands=
  mypy --cache-dir="{envdir}/mypy_cache" -p git_pw {posargs}

[testenv:report]
commands =
  coverage report
  coverage html

[testenv:clean]
commands =
  coverage erase

[testenv:docs]
deps =
  -r{toxinidir}/docs/requirements.txt
commands =
  sphinx-build {posargs:-E -W} docs docs/_build/html

[testenv:man]
deps =
  click-man~=0.6.0
commands =
  click-man git-pw
